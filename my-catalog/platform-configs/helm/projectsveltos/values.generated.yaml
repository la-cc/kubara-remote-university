projectsveltos:
  global:
    imagePullSecrets:
      - name: image-pull-secret
  prometheus:
    enabled: false
  agent:
    managementCluster: true
  accessManager:
    manager:
      resources:
        limits:
          cpu: 1000m
          memory: 1024Mi
        requests:
          cpu: 20m
          memory: 256Mi
  addonController:
    initialization:
      resources:
        limits:
          cpu: 1000m
          memory: 1024Mi
        requests:
          cpu: 20m
          memory: 256Mi
    controller:
      extraArgs:
        worker-number: "40"
      resources:
        requests:
          memory: 512Mi
          cpu: 500m
  classifierManager:
    manager:
      resources:
        limits:
          cpu: 1000m
          memory: 1024Mi
        requests:
          cpu: 200m
          memory: 256Mi

    agentPatchConfigMap:
      data:
        deployment-patch: |-
          patch: |-
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: sveltos-agent-manager
              namespace: projectsveltos
            spec:
              template:
                spec:
                  imagePullSecrets:
                    - name: image-pull-secret
                  containers:
                    - name: manager
                      resources:
                        requests:
                          cpu: 256m
                          memory: 512Mi


  eventManager:
    manager:
      resources:
        limits:
          cpu: 1000m
          memory: 1024Mi
        requests:
          cpu: 20m
          memory: 256Mi
  hcManager:
    manager:
      resources:
        limits:
          cpu: 1000m
          memory: 1024Mi
        requests:
          cpu: 20m
          memory: 256Mi
  crdManagerJob:
    crdManager:
      resources:
        requests:
          memory: 256Mi
  registerMgmtClusterJob:
    registerMgmtCluster:
      resources:
        requests:
          memory: 256Mi
  scManager:
    manager:
      resources:
        limits:
          cpu: 1000m
          memory: 1024Mi
        requests:
          cpu: 20m
          memory: 256Mi
  shardController:
    manager:
      resources:
        limits:
          cpu: 1000m
          memory: 1024Mi
        requests:
          cpu: 20m
          memory: 256Mi
  techsupportController:
    controller:
      resources:
        limits:
          cpu: 1000m
          memory: 2048Mi
        requests:
          cpu: 20m
          memory: 256Mi
  mcpServer:
    controller:
      resources:
        limits:
          cpu: 1000m
          memory: 2048Mi
        requests:
          cpu: 200m
          memory: 256Mi


dashboardIngress:
  enabled: true
  host: sveltos.controlplane-dev.stackit.run
  path: "/"
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: projectsveltos-dashboard-subdomain-tls

clusterProfiles:
  kro:
    name: kro
    spec:
      syncMode: Continuous
      clusterSelector:
        matchLabels:
          kro: enabled
      helmCharts:
        - repositoryURL: oci://registry.k8s.io/kro/charts
          repositoryName: kro
          chartName: kro
          chartVersion: 0.9.1
          releaseName: kro
          releaseNamespace: kro-system
          helmChartAction: Install

  cert-manager:
    name: cert-manager
    spec:
      syncMode: Continuous
      clusterSelector:
        matchLabels:
          cert-manager: enabled
      helmCharts:
        - repositoryURL: https://charts.jetstack.io
          repositoryName: jetstack
          chartName: jetstack/cert-manager
          chartVersion: v1.20.2
          releaseName: cert-manager
          releaseNamespace: cert-manager
          helmChartAction: Install


  kyverno:
    name: kyverno
    spec:
      syncMode: Continuous
      clusterSelector:
        matchLabels:
          kyverno: enabled
      helmCharts:
        - repositoryURL: https://kyverno.github.io/kyverno
          repositoryName: kyverno
          chartName: kyverno/kyverno
          chartVersion: 3.7.1
          releaseName: kyverno
          releaseNamespace: kyverno
          helmChartAction: Install

  external-secrets:
    name: external-secrets
    spec:
      syncMode: Continuous
      clusterSelector:
        matchLabels:
          external-secrets: enabled
      helmCharts:
        - repositoryURL: https://charts.external-secrets.io/
          repositoryName: external-secrets
          chartName: external-secrets/external-secrets
          chartVersion: 2.3.0
          releaseName: external-secrets
          releaseNamespace: external-secrets
          helmChartAction: Install

  kube-prometheus-stack:
    name: kube-prometheus-stack
    spec:
      syncMode: Continuous
      clusterSelector:
        matchLabels:
          kube-prometheus-stack: enabled
      helmCharts:
        - repositoryURL: https://prometheus-community.github.io/helm-charts
          repositoryName: prometheus-community
          chartName: prometheus-community/kube-prometheus-stack
          chartVersion: 82.18.0
          releaseName: kube-prometheus-stack
          releaseNamespace: monitoring
          helmChartAction: Install
        - repositoryURL: https://prometheus-community.github.io/helm-charts
          repositoryName: prometheus-community
          chartName: prometheus-community/prometheus-blackbox-exporter
          chartVersion: 11.9.1
          releaseName: prometheus-blackbox-exporter
          releaseNamespace: monitoring
          helmChartAction: Install
