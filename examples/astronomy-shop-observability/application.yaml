apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/la-cc/kubara-remote-university.git
    targetRevision: main
    path: examples/astronomy-shop-observability
  destination:
    name: in-cluster
    namespace: shop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
